<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car support assistant</title>
<!-- Markdown rendering + sanitising (replies are never inserted as raw HTML) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f4f6f5; --panel: #ffffff; --text: #1c2321; --muted: #5f6b67; --line: #dfe5e2;
    --accent: #2e7d55; --accent-text: #ffffff; --me: #e3f1ea; --bot: #ffffff; --warn: #8a5a00; --warn-bg: #fff6e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141917; --panel: #1c2321; --text: #e7ecea; --muted: #9aa7a2; --line: #2c3532;
      --accent: #4caf7d; --accent-text: #0c120f; --me: #23382d; --bot: #1f2725; --warn: #ffcc66; --warn-bg: #3a2f14;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 820px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  header small { color: var(--muted); display: block; font-size: 12px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); padding: 7px 12px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.customer { align-self: flex-end; background: var(--me); white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--bot); }
  .msg.assistant p { margin: 0 0 8px; } .msg.assistant p:last-child { margin-bottom: 0; }
  .msg table { border-collapse: collapse; margin: 6px 0; font-size: 14px; display: block; overflow-x: auto; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .msg a { color: var(--accent); }
  .status { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; }
  .confirm { align-self: flex-start; max-width: 85%; background: var(--warn-bg); border: 1px solid var(--warn);
             border-radius: 12px; padding: 12px 14px; }
  .confirm h3 { margin: 0 0 6px; font-size: 14px; color: var(--warn); }
  .confirm ul { margin: 0 0 10px; padding-left: 18px; font-size: 14px; }
  .confirm .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .confirm input { flex: 1; min-width: 140px; }
  .error { align-self: flex-start; color: var(--warn); font-size: 14px; }
  form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
                     background: var(--panel); color: var(--text); }
  .hint { color: var(--muted); font-size: 12px; margin-top: -8px; padding-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Car support assistant</h1><small>Prices, showrooms, servicing, test drives and complaints</small></div>
    <div><button id="locate" title="Share my location for nearby showrooms">📍 Share location</button>
         <button id="new">New chat</button></div>
  </header>
  <div id="chat" aria-live="polite"></div>
  <form id="form">
    <input id="input" type="text" maxlength="2000" autocomplete="off" placeholder="Ask about a car, a price, a showroom…" required>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
  <div class="hint" id="hint">Prices are estimates. Independent demo, not affiliated with the manufacturer.</div>
</div>
<script>
const chat = document.getElementById("chat"), input = document.getElementById("input"),
      send = document.getElementById("send"), hint = document.getElementById("hint");
let threadId = null, location_ = null, busy = false;
try { threadId = localStorage.getItem("thread_id"); } catch (e) {}

function scroll() { chat.scrollTop = chat.scrollHeight; }
function render(md) { return DOMPurify.sanitize(marked.parse(md || "")); }
function add(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "assistant") div.innerHTML = render(text); else div.textContent = text;
  div.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  chat.appendChild(div); scroll(); return div;
}
function setBusy(b) { busy = b; send.disabled = b; input.disabled = b; if (!b) input.focus(); }
function rememberThread(id) { threadId = id; try { localStorage.setItem("thread_id", id); } catch (e) {} }

function showConfirm(c) {
  const box = document.createElement("div");
  box.className = "confirm";
  const h = document.createElement("h3"); h.textContent = c.question || "Shall I go ahead with this?";
  const ul = document.createElement("ul");
  (c.actions || []).forEach(a => {
    const li = document.createElement("li");
    const details = Object.entries(a.details || {}).filter(([, v]) => v !== null && v !== "")
      .map(([k, v]) => `${k.replace(/_/g, " ")}: ${v}`).join(", ");
    li.textContent = `${a.tool.replace(/_/g, " ")} — ${details}`;
    ul.appendChild(li);
  });
  const row = document.createElement("div"); row.className = "row";
  const yes = document.createElement("button"); yes.className = "primary"; yes.textContent = "Confirm";
  const no = document.createElement("button"); no.textContent = "Cancel";
  const note = document.createElement("input"); note.type = "text"; note.maxLength = 500; note.placeholder = "Optional note if cancelling";
  row.append(yes, no, note); box.append(h, ul, row); chat.appendChild(box); scroll();
  const answer = approved => {
    yes.disabled = no.disabled = note.disabled = true;
    stream("/api/resume", { thread_id: threadId, approved, feedback: approved ? null : (note.value.trim() || null) });
  };
  yes.onclick = () => answer(true); no.onclick = () => answer(false);
}

async function stream(url, body) {
  setBusy(true);
  const status = document.createElement("div"); status.className = "status"; status.textContent = "…";
  chat.appendChild(status); scroll();
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(typeof e.detail === "string" ? e.detail : "Request failed"); }
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const event = (chunk.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((chunk.match(/^data: (.*)$/m) || [, "{}"])[1]);
        if (event === "thread") rememberThread(data.thread_id);
        else if (event === "status") status.textContent = data.text;
        else if (event === "reply") { status.remove(); add("assistant", data.text); }
        else if (event === "confirm") { status.remove(); showConfirm(data); }
        else if (event === "error") { status.remove(); const d = document.createElement("div"); d.className = "error"; d.textContent = data.text; chat.appendChild(d); }
      }
    }
  } catch (err) {
    status.remove();
    const d = document.createElement("div"); d.className = "error";
    d.textContent = "Couldn't reach the assistant: " + err.message; chat.appendChild(d);
  } finally { status.isConnected && status.remove(); setBusy(false); scroll(); }
}

document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim(); if (!text || busy) return;
  input.value = ""; add("customer", text);
  const body = { thread_id: threadId, message: text };
  if (location_) { body.lat = location_.lat; body.long = location_.long; location_ = null; }
  stream("/api/chat", body);
};
document.getElementById("new").onclick = () => {
  threadId = null; try { localStorage.removeItem("thread_id"); } catch (e) {}
  chat.innerHTML = ""; add("assistant", "Hi! Ask me about Škoda cars, on-road prices, the nearest showroom, servicing, a test drive, or a problem with your car.");
};
document.getElementById("locate").onclick = () => {
  if (!navigator.geolocation) { hint.textContent = "Your browser can't share a location."; return; }
  navigator.geolocation.getCurrentPosition(
    p => { location_ = { lat: +p.coords.latitude.toFixed(5), long: +p.coords.longitude.toFixed(5) };
           hint.textContent = "Location ready: it's sent with your next message (e.g. “nearest showroom”)."; },
    () => { hint.textContent = "Location not shared (permission denied or unavailable)."; });
};

(async function restore() {
  if (!threadId) { document.getElementById("new").onclick(); return; }
  try {
    const res = await fetch("/api/threads/" + encodeURIComponent(threadId));
    if (!res.ok) throw new Error();
    const t = await res.json();
    if (!t.messages.length && !t.pending) { document.getElementById("new").onclick(); return; }
    t.messages.forEach(m => add(m.role, m.text));
    if (t.pending) showConfirm(t.pending);
  } catch (e) { document.getElementById("new").onclick(); }
})();
</script>
</body>
</html>
